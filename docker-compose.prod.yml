# Production stack on the VPS (deployed by .github/workflows/deploy.yml via
# scripts/deploy.sh). Values come from .env next to this file (never committed).
#
#   app      Next.js on 127.0.0.1:3303 (CloudPanel reverse proxy -> https://timesheet.ptexsolutions.com)
#   db       MySQL 8.0, data in the `db-data` volume
#   migrate  runs `prisma migrate deploy` before every app start
name: ptex-timesheet

services:
  db:
    image: mysql:8.0
    container_name: timesheet-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Kolkata
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      default:
      # Lets the existing esg-qa-pma phpMyAdmin reach this DB as host `timesheet-db`.
      esg-qa:
        aliases: [timesheet-db]

  migrate:
    build: { context: ., target: build }
    image: ptex-timesheet:build
    env_file: .env
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ., target: run }
    image: ptex-timesheet:latest
    container_name: timesheet-app
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3303:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }

networks:
  esg-qa:
    external: true
    name: esg-qa_esg-qa-net

volumes:
  db-data:
